<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a Mi Página</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"

  <body>
    <header class="bg-primary text-white text-center p-4">
      <h1>Bienvenido a Mi Página</h1>
      <nav>
        <ul class="list-unstyled d-flex justify-content-center">
          <li class="mx-3">
            <a href="#seccion1" class="text-white">Sección 1</a>

            <a href="#contacto" class="text-white">Contacto</a>

      <div class="d-flex justify-content-center gap-3 mt-3">

        <button class="btn btn-light" id="aumentarTextoBtn">

      <section id="seccion1" class="mb-5">
        <h2>Sección 1</h2>
        <p>Este es un texto de prueba. Puedes cambiar su color de fondo.</p>
        <button class="btn btn-secondary" id="cambiarFondoBtn">
          Cambiar Fondo
        </button>
      </section>

      <section id="seccion2" class="mb-5">
        <h2>Sección 2</h2>
        <p>Contador de clics: <span id="contador">0</span></p>
        <button class="btn btn-primary" id="incrementarContadorBtn">
          Incrementar Clics
        </button>
      </section>

      <button
        class="btn btn-dark position-fixed bottom-0 end-0 m-3"
        id="irArribaBtn"
      >
        Ir Arriba
      </button>
    </main>

    <footer id="contacto" class="bg-dark text-white text-center py-3">
      <p>
        &copy; 2025 Mi Página Web |
        <a class="text-white">aleaguilarc4@gmail.com</a>
      </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
